# Despliegue automático en Cloudflare Pages (https://eroplayerdata.pages.dev)
# en cada push a main. Sube solo los ficheros estáticos de la web con Wrangler
# (Direct Upload, permitido en proyectos conectados a Git), así no depende de la
# integración Git de Cloudflare.
#
# Requiere los secretos del repo CLOUDFLARE_API_TOKEN (token con permiso
# Account > Cloudflare Pages > Edit) y CLOUDFLARE_ACCOUNT_ID (id de la cuenta;
# no se escribe en el repo). Si falta el token, el despliegue se salta.
# Las actions van fijadas por SHA de commit (no por tag mutable).
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: eroplayerdata
      # Acepta también el nombre con la errata con que se creó el secreto (CLOUDFARE_API_TOKEN)
      HAS_TOKEN: ${{ (secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN) != '' }}
    steps:
      - name: Comprobar secreto
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN; no se despliega en Cloudflare Pages."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_TOKEN == 'true'

      - name: Preparar ficheros de la web
        if: env.HAS_TOKEN == 'true'
        run: |
          mkdir dist
          cp -r index.html 404.html robots.txt sitemap.xml _headers css js vendor assets LICENSE README.md dist/
          ls -R dist | head -50

      - name: Desplegar con Wrangler
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
