name: relay-bot-dms

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: relay-bot-dms
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar a relay-bot-dms
        env:
          EDC_INTERNAL_SECRET: ${{ secrets.EDC_INTERNAL_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${EDC_INTERNAL_SECRET:-}" ]; then
            echo "::error::Falta el secreto EDC_INTERNAL_SECRET del repositorio"; exit 1
          fi
          curl -sS --fail-with-body --max-time 90 -X POST \
            -H "Content-Type: application/json" \
            -H "x-edc-secret: ${EDC_INTERNAL_SECRET}" \
            -d '{}' \
            https://xwyauyjeteztlevvtydb.supabase.co/functions/v1/relay-bot-dms
