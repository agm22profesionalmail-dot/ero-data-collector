<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0e1a" />
  <meta name="description" content="A free tool for the Splatoon community: design your Splatoon 3 splashtag and save your character. Made by ERO's Team. Fan project — not affiliated with Nintendo. Splatoon is a trademark of Nintendo." />
  <title>ERO Data Collector — Submit your Splatoon 3 character</title>
  <link rel="canonical" href="https://eroplayerdata.pages.dev/" />
  <link rel="icon" href="assets/favicon.png" sizes="any" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <!-- Open Graph / redes sociales (compartir en X, Discord, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ERO Data Collector" />
  <meta property="og:title" content="ERO Data Collector — Submit your Splatoon 3 character" />
  <meta property="og:description" content="A free tool for the Splatoon community: connect with Discord or X, design your Splatoon 3 splashtag and save your character. Made by ERO's Team. Fan project, not affiliated with Nintendo." />
  <meta property="og:url" content="https://eroplayerdata.pages.dev/" />
  <meta property="og:image" content="https://eroplayerdata.pages.dev/assets/og-image.jpg?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="es_ES" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ERO Data Collector — Submit your Splatoon 3 character" />
  <meta name="twitter:description" content="A free tool for the Splatoon community: connect with Discord or X, design your Splatoon 3 splashtag and save your character. Made by ERO's Team." />
  <meta name="twitter:image" content="https://eroplayerdata.pages.dev/assets/og-image.jpg?v=2" />

  <link rel="preconnect" href="https://raw.githubusercontent.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ERO Data Collector",
    "url": "https://eroplayerdata.pages.dev/",
    "description": "A free tool for the Splatoon community: design your Splatoon 3 splashtag and save your character. Made by ERO's Team. Fan project — not affiliated with Nintendo.",
    "applicationCategory": "UtilityApplication",
    "operatingSystem": "Web",
    "inLanguage": ["en", "es"],
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
</head>
<body>

  <!-- decoración Splatoon — fija, detrás del contenido, no interactiva -->
  <div class="edc-bg-decor" aria-hidden="true">
    <div class="edc-bg-layer"></div>
    <div class="edc-bg-pattern"></div>
    <img class="edc-decor edc-decor-splat-main"   src="assets/decor/splat-splatfest.png" alt="">
    <img class="edc-decor edc-decor-splat-purple" src="assets/decor/splat-purple.png"    alt="">
    <img class="edc-decor edc-decor-star s1"      src="assets/decor/star-shine.png"      alt="">
    <img class="edc-decor edc-decor-star s2"      src="assets/decor/star-shine.png"      alt="">
    <img class="edc-decor edc-decor-star s3"      src="assets/decor/star-shine.png"      alt="">
    <img class="edc-decor edc-decor-graffiti"     src="assets/decor/decor-graffiti.webp"  alt="">
  </div>

  <header class="edc-header">
    <div class="edc-brand">
      <img class="edc-brand-logo" src="assets/brand-logo.webp" alt="ERO's Team" />
      <div class="edc-brand-text">
        <h1 id="appTitle"><span class="edc-brand-accent">ERO</span> Data Collector</h1>
        <span id="appSub" class="edc-sub"></span>
      </div>
    </div>
    <div class="edc-header-right">
      <div class="edc-lang" id="langSwitch">
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
      </div>
      <div id="authArea" class="edc-auth"></div>
    </div>
  </header>

  <main id="app" class="edc-main"></main>

  <footer id="footer" class="edc-footer"></footer>
  <div id="toast" class="edc-toast" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script>
  <script type='text/javascript'>kofiwidget2.init('Support this project', '#9673f5', 'Q2Z422804H');kofiwidget2.draw();</script>
</body>
</html>
